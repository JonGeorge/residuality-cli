[package]
name = "residuality"
version = "1.0.0"
description = "A CLI for practicing Residuality Theory"
edition = "2024"
default-run = "residuality"
license = "Unlicense"
repository = "https://github.com/JonGeorge/residuality-cli"
keywords = ["architecture", "residuality", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "res"
path ="src/bin/res.rs"

[[bin]]
name = "residuality"
path ="src/main.rs"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive"] }
csv = "1.4.0"
inquire = "0.9.4"
serde = { version = "1", features = ["derive"] }
